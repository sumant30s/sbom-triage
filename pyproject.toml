[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-triage"
version = "0.1.0"
description = "Explainable CycloneDX vulnerability triage with OSV, EPSS and CISA KEV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3", "packageurl-python>=0.16,<1", "cvss>=3.4,<4",
  "streamlit>=1.40,<2", "pandas>=2.2,<4", "plotly>=5.24,<7", "reportlab>=4.2,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "responses>=0.25,<1", "ruff>=0.9,<1", "bandit>=1.8,<2"]

[project.scripts]
sbom-triage = "sbom_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
